<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파일 업로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>파일 업로드</h2>

    <!-- 알림 메시지 -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- 단일 파일 업로드 -->
    <div class="card mb-4">
        <div class="card-header">단일 파일 업로드</div>
        <div class="card-body">
            <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <input type="file" class="form-control" name="file" required>
                </div>
                <button type="submit" class="btn btn-primary">업로드</button>
            </form>
        </div>
    </div>

    <!-- 다중 파일 업로드 -->
    <div class="card mb-4">
        <div class="card-header">다중 파일 업로드</div>
        <div class="card-body">
            <form th:action="@{/upload/multiple}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <input type="file" class="form-control" name="files" multiple required>
                </div>
                <button type="submit" class="btn btn-primary">업로드</button>
            </form>
        </div>
    </div>

    <!-- 업로드된 파일 목록 -->
    <h3>업로드된 파일 목록</h3>
    <table class="table table-striped" th:if="${!files.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>원본 파일명</th>
            <th>크기</th>
            <th>타입</th>
            <th>업로드 시간</th>
            <th>액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="file : ${files}">
            <td th:text="${file.id}"></td>
            <td th:text="${file.originalFileName}"></td>
            <td th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 1)} + ' KB'"></td>
            <td th:text="${file.contentType}"></td>
            <td th:text="${#temporals.format(file.uploadedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <a th:href="@{/download/{id}(id=${file.id})}" class="btn btn-sm btn-outline-success">다운로드</a>
                <form th:action="@{/delete/{id}(id=${file.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('삭제하시겠습니까?');">삭제
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${files.isEmpty()}" class="text-muted">업로드된 파일이 없습니다.</p>
</div>
</body>
</html>
