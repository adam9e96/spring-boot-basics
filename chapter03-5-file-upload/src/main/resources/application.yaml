spring:
  application:
    name: chapter03-5-file-upload
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 업로드 파일 저장 경로 (OS에 맞게 변경)
upload:
  dir: ${java.io.tmpdir}/chapter03-5-uploads
