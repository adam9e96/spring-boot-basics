<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 계정 생성</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input {
            width: auto;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            color: #fff;
        }

        .btn-primary {
            background: #4a90d9;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .message {
            padding: 12px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            margin-bottom: 16px;
            color: #155724;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>새 계정 생성</h1>

    <div th:if="${message}" class="message" th:text="${message}"></div>

    <!--
    th:object: 폼 전체를 이 객체에 바인딩
    th:field: 개별 필드를 객체의 프로퍼티에 바인딩 (*{...} 문법)
    폼 제출 시 각 필드의 값이 Account 객체의 해당 필드에 자동 매핑된다.
    -->
    <form th:action="@{/accounts}" th:object="${account}" method="post">
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요">
            <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
            <label for="phone">전화번호</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="010-1234-5678">
            <div th:if="${#fields.hasErrors('phone')}" class="error" th:errors="*{phone}"></div>
        </div>
        <div class="form-group">
            <label for="address">주소 (선택)</label>
            <input type="text" id="address" th:field="*{address}" placeholder="주소를 입력하세요">
        </div>
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="privacyAgreement" th:field="*{privacyAgreement}">
                <label for="privacyAgreement" style="margin-bottom: 0; font-weight: normal;">개인정보 수집에 동의합니다</label>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">생성</button>
            <a th:href="@{/accounts}" class="btn btn-secondary">목록으로</a>
        </div>
    </form>
</div>
</body>
</html>
