<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 수정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input {
            width: auto;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            color: #fff;
        }

        .btn-primary {
            background: #4a90d9;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>계정 수정</h1>

    <!--
    수정 폼의 핵심:
    1. method="post" + hidden _method="put" → HiddenHttpMethodFilter가 PUT으로 변환
    2. th:object="${account}" → 기존 데이터가 각 th:field에 자동으로 채워짐
    -->
    <form th:action="@{/accounts/{id}(id=${account.id})}" th:object="${account}" method="post">
        <input type="hidden" name="_method" value="put"/>
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}">
            <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
            <label for="phone">전화번호</label>
            <input type="text" id="phone" th:field="*{phone}">
            <div th:if="${#fields.hasErrors('phone')}" class="error" th:errors="*{phone}"></div>
        </div>
        <div class="form-group">
            <label for="address">주소 (선택)</label>
            <input type="text" id="address" th:field="*{address}">
        </div>
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="privacyAgreement" th:field="*{privacyAgreement}">
                <label for="privacyAgreement" style="margin-bottom: 0; font-weight: normal;">개인정보 수집에 동의합니다</label>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">수정</button>
            <a th:href="@{/accounts/{id}(id=${account.id})}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
