<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할일 수정</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd;
               border-radius: 6px; font-size: 14px; }
        textarea { resize: vertical; min-height: 80px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; }
        .checkbox-group input { width: auto; }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 6px;
               cursor: pointer; text-decoration: none; font-size: 14px; color: #fff; }
        .btn-primary { background: #4a90d9; }
        .btn-secondary { background: #6c757d; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        a { text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>할일 수정</h1>
    <form th:action="@{/todos/{id}(id=${todo.id})}" method="post">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" th:value="${todo.title}" required>
        </div>
        <div class="form-group">
            <label for="description">설명</label>
            <textarea id="description" name="description" th:text="${todo.description}"></textarea>
        </div>
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="completed" name="completed" value="true"
                       th:checked="${todo.completed}">
                <label for="completed" style="margin-bottom: 0;">완료</label>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">저장</button>
            <a th:href="@{/todos/{id}(id=${todo.id})}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
